apiVersion: v1
kind: Service
metadata:
  name: indy-pool
  namespace: indy
  labels:
    app: indy-node
spec:
  clusterIP: None 
  selector:
    app: indy-node
  ports:
    - port: 9701
      name: node-1-port
    - port: 30701
      name: client-1-port
    - port: 9702
      name: node-2-port
    - port: 30702
      name: client-2-port
    - port: 9703
      name: node-3-port
    - port: 30703
      name: client-3-port
    - port: 9704
      name: node-4-port
    - port: 30704
      name: client-4-port