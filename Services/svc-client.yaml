# ==========================================
# Client Access for Node 1
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: indy-client-node-1
  namespace: indy
spec:
  type: NodePort
  selector:
    instance: node-1 
  ports:
    - name: client-port
      protocol: TCP
      port: 30701
      targetPort: 30701
      nodePort: 30701
---
